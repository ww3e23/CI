name: Deploy Firebase Functions

on:
  push:
    branches: [main]
    paths:
      - functions/**
      - firebase.json
      - .firebaserc
      - .github/workflows/deploy-firebase-functions.yml
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    # 需在 repo Secrets 設定 FIREBASE_TOKEN（firebase login:ci）
    if: ${{ secrets.FIREBASE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Install function deps
        working-directory: functions
        run: npm ci || npm install
      - name: Build functions
        working-directory: functions
        run: npm run build
      - name: Deploy functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase use ci-inspection
          firebase deploy --only functions --non-interactive
